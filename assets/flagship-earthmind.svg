<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="flagBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Planet Earth Glow Gradient -->
    <radialGradient id="earthGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.1"/>
    </radialGradient>

    <linearGradient id="atmosGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </linearGradient>

    <!-- Filter -->
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes orbitSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseGlobe {
        0%, 100% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.02); opacity: 1; }
      }
      @keyframes flowLine {
        0% { stroke-dashoffset: 20; }
        100% { stroke-dashoffset: 0; }
      }
      .orbit-ring {
        animation: orbitSpin 20s linear infinite;
        transform-origin: 130px 145px;
      }
      .flow-stream {
        stroke-dasharray: 4 4;
        animation: flowLine 1.5s linear infinite;
      }
      .mono-f {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }
      .sans-f {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="8" y="8" width="944" height="254" rx="16" fill="url(#flagBg)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#boxShadow)"/>

  <!-- Top Flagship Header -->
  <g transform="translate(28, 22)">
    <rect x="0" y="0" width="176" height="22" rx="11" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="1"/>
    <text x="88" y="15" text-anchor="middle" class="mono-f" font-size="9.5" font-weight="700" fill="#0284C7" letter-spacing="0.5">FLAGSHIP PLATFORM // 01</text>
    <text x="188" y="16" class="sans-f" font-size="12" font-weight="700" fill="#0F172A">
      EARTHMIND  •  <tspan font-weight="400" fill="#64748B">Planetary Environmental Intelligence &amp; 3D Digital Twin</tspan>
    </text>

    <!-- Version & Expo Pill (Right) -->
    <rect x="750" y="0" width="154" height="22" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="827" y="15" text-anchor="middle" class="mono-f" font-size="9" font-weight="600" fill="#475569">SCIENCE EXPO 2026</text>
  </g>

  <!-- Left: Stylized 3D Digital Twin Globe Illustration -->
  <g transform="translate(20, 10)">
    <!-- Atmospheric Outer Halo -->
    <circle cx="120" cy="135" r="75" fill="none" stroke="#BAE6FD" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="120" cy="135" r="62" fill="url(#atmosGlow)"/>

    <!-- Earth Sphere Core -->
    <circle cx="120" cy="135" r="54" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>

    <!-- Stylized Continents & Lat/Long grid lines -->
    <path d="M 80 120 Q 100 105 130 115 Q 155 125 140 150 Q 110 160 85 140 Z" fill="#0284C7" opacity="0.6"/>
    <path d="M 115 110 Q 140 100 160 120 Q 150 140 125 130 Z" fill="#10B981" opacity="0.5"/>
    <ellipse cx="120" cy="135" rx="54" ry="22" fill="none" stroke="#38BDF8" stroke-width="0.8" opacity="0.5"/>
    <ellipse cx="120" cy="135" rx="54" ry="40" fill="none" stroke="#38BDF8" stroke-width="0.8" opacity="0.3"/>
    <line x1="120" y1="81" x2="120" y2="189" stroke="#38BDF8" stroke-width="0.8" opacity="0.5"/>

    <!-- Orbit Satellite -->
    <g class="orbit-ring">
      <ellipse cx="120" cy="135" rx="72" ry="32" fill="none" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2 3"/>
      <!-- Satellite marker -->
      <circle cx="192" cy="135" r="3.5" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1"/>
      <rect x="186" y="132" width="12" height="6" rx="1" fill="none" stroke="#F59E0B" stroke-width="0.8"/>
    </g>

    <text x="120" y="212" text-anchor="middle" class="mono-f" font-size="9" font-weight="700" fill="#0284C7">GLSL 60 FPS SHADER</text>
  </g>

  <!-- Center & Right: Pipeline Flow Architecture -->
  <g transform="translate(225, 60)">
    <!-- 4 Pipeline Stages (Connected with animated data stream) -->

    <!-- STAGE 1: Telemetry Ingestion -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="158" height="110" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <text x="12" y="20" class="mono-f" font-size="9" font-weight="700" fill="#0284C7">STAGE 01 // INPUT</text>
      <text x="12" y="38" class="sans-f" font-size="12" font-weight="700" fill="#0F172A">Remote Sensing</text>
      <text x="12" y="56" class="sans-f" font-size="10" fill="#64748B">• Copernicus Sentinel-1/2</text>
      <text x="12" y="72" class="sans-f" font-size="10" fill="#64748B">• ISRO-NASA NISAR SAR</text>
      <text x="12" y="88" class="sans-f" font-size="10" fill="#64748B">• Real-time NOAA SST</text>
      <rect x="12" y="96" width="134" height="2" fill="#0284C7"/>
    </g>

    <!-- Connector Line 1 to 2 -->
    <line x1="158" y1="55" x2="182" y2="55" stroke="#0284C7" stroke-width="1.8" class="flow-stream"/>
    <polygon points="182,52 188,55 182,58" fill="#0284C7"/>

    <!-- STAGE 2: 3D Visualization Core -->
    <g transform="translate(188, 0)">
      <rect x="0" y="0" width="158" height="110" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <text x="12" y="20" class="mono-f" font-size="9" font-weight="700" fill="#6366F1">STAGE 02 // ENGINE</text>
      <text x="12" y="38" class="sans-f" font-size="12" font-weight="700" fill="#0F172A">Three.js + GLSL</text>
      <text x="12" y="56" class="sans-f" font-size="10" fill="#64748B">• Rayleigh scattering</text>
      <text x="12" y="72" class="sans-f" font-size="10" fill="#64748B">• Dynamic cloud layers</text>
      <text x="12" y="88" class="sans-f" font-size="10" fill="#64748B">• Day/night terminator</text>
      <rect x="12" y="96" width="134" height="2" fill="#6366F1"/>
    </g>

    <!-- Connector Line 2 to 3 -->
    <line x1="346" y1="55" x2="370" y2="55" stroke="#6366F1" stroke-width="1.8" class="flow-stream"/>
    <polygon points="370,52 376,55 370,58" fill="#6366F1"/>

    <!-- STAGE 3: Multimodal Voice Intelligence -->
    <g transform="translate(376, 0)">
      <rect x="0" y="0" width="158" height="110" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <text x="12" y="20" class="mono-f" font-size="9" font-weight="700" fill="#10B981">STAGE 03 // INTELLIGENCE</text>
      <text x="12" y="38" class="sans-f" font-size="12" font-weight="700" fill="#0F172A">Gemini 2.0 Live</text>
      <text x="12" y="56" class="sans-f" font-size="10" fill="#64748B">• Natural voice copilot</text>
      <text x="12" y="72" class="sans-f" font-size="10" fill="#64748B">• Low-latency stream</text>
      <text x="12" y="88" class="sans-f" font-size="10" fill="#64748B">• Planetary QA reasoning</text>
      <rect x="12" y="96" width="134" height="2" fill="#10B981"/>
    </g>

    <!-- Connector Line 3 to 4 -->
    <line x1="534" y1="55" x2="558" y2="55" stroke="#10B981" stroke-width="1.8" class="flow-stream"/>
    <polygon points="558,52 564,55 558,58" fill="#10B981"/>

    <!-- STAGE 4: Biophysical Guardrails -->
    <g transform="translate(564, 0)">
      <rect x="0" y="0" width="144" height="110" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
      <text x="12" y="20" class="mono-f" font-size="9" font-weight="700" fill="#F59E0B">STAGE 04 // VERIFY</text>
      <text x="12" y="38" class="sans-f" font-size="12" font-weight="700" fill="#0F172A">Physical Limits</text>
      <text x="12" y="56" class="sans-f" font-size="10" fill="#64748B">• Energy conservation</text>
      <text x="12" y="72" class="sans-f" font-size="10" fill="#64748B">• Perturbation engine</text>
      <text x="12" y="88" class="sans-f" font-size="10" fill="#64748B">• Zero hallucination</text>
      <rect x="12" y="96" width="120" height="2" fill="#F59E0B"/>
    </g>

    <!-- Bottom Metrics Strip (4 Verified Badges) -->
    <g transform="translate(0, 126)">
      <!-- Metric 1 -->
      <rect x="0" y="0" width="168" height="34" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="16" class="mono-f" font-size="8.5" font-weight="600" fill="#64748B">FRAME PERFORMANCE</text>
      <text x="14" y="28" class="sans-f" font-size="11" font-weight="700" fill="#0F172A">60 FPS Smooth WebGL</text>

      <!-- Metric 2 -->
      <rect x="180" y="0" width="168" height="34" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="16" class="mono-f" font-size="8.5" font-weight="600" fill="#64748B">VOICE LATENCY</text>
      <text x="14" y="28" class="sans-f" font-size="11" font-weight="700" fill="#0284C7">&lt; 180ms Round-Trip</text>

      <!-- Metric 3 -->
      <rect x="360" y="0" width="168" height="34" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="16" class="mono-f" font-size="8.5" font-weight="600" fill="#64748B">CLIMATE GUARDRAILS</text>
      <text x="14" y="28" class="sans-f" font-size="11" font-weight="700" fill="#10B981">100% Enforced</text>

      <!-- Metric 4 -->
      <rect x="540" y="0" width="168" height="34" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="16" class="mono-f" font-size="8.5" font-weight="600" fill="#64748B">PRODUCTION TARGET</text>
      <text x="14" y="28" class="sans-f" font-size="11" font-weight="700" fill="#6366F1">earthmind.vercel.app</text>
    </g>
  </g>
</svg>

