<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Glass Surface Gradient -->
    <linearGradient id="surfaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Subtle Accent Gradient for Title -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="65%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- K-01 Bot Metallic Gradient -->
    <linearGradient id="botChassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <linearGradient id="botVisor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Subtle Dot Pattern -->
    <pattern id="dotPattern" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94A3B8" fill-opacity="0.25"/>
    </pattern>

    <!-- Soft Ambient Drop Shadow -->
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes floatBot {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes pulseOnline {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(1.15); }
      }
      @keyframes radarPing {
        0% { r: 4px; opacity: 0.9; }
        100% { r: 14px; opacity: 0; }
      }
      @keyframes blinkEyes {
        0%, 92%, 100% { transform: scaleY(1); }
        95% { transform: scaleY(0.1); }
      }
      @keyframes waveAntenna {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(8deg); }
      }

      .floating-bot {
        animation: floatBot 4s ease-in-out infinite;
        transform-origin: center;
      }
      .online-dot {
        animation: pulseOnline 2s ease-in-out infinite;
        transform-origin: 153px 43px;
      }
      .ping-ring {
        animation: radarPing 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite;
        transform-origin: 153px 43px;
      }
      .bot-eye {
        animation: blinkEyes 3.8s infinite;
        transform-origin: center;
      }
      .bot-antenna {
        animation: waveAntenna 3s ease-in-out infinite;
        transform-origin: 800px 105px;
      }
      .mono-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }
      .sans-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Canvas Outer Container -->
  <rect x="8" y="8" width="944" height="334" rx="20" fill="url(#bgGrad)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow)"/>

  <!-- Background Technical Dot Pattern -->
  <rect x="8" y="8" width="944" height="334" rx="20" fill="url(#dotPattern)"/>

  <!-- Technical Hairline Border Accents (Top Corner Accents) -->
  <path d="M 28 24 L 28 16 L 36 16" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
  <path d="M 932 24 L 932 16 L 924 16" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
  <path d="M 28 326 L 28 334 L 36 334" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
  <path d="M 932 326 L 932 334 L 924 334" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- System Top Bar -->
  <g id="top-bar">
    <!-- Status Pill: Online -->
    <rect x="36" y="28" width="170" height="30" rx="15" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <circle cx="53" cy="43" r="4" fill="#10B981" class="online-dot"/>
    <circle cx="53" cy="43" r="8" fill="none" stroke="#10B981" stroke-width="1.2" class="ping-ring"/>
    <text x="66" y="47" class="mono-text" font-size="11" font-weight="600" fill="#0F172A" letter-spacing="0.5">SYS STATUS: ONLINE</text>

    <!-- Node Pill -->
    <rect x="216" y="28" width="168" height="30" rx="15" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="232" y="47" class="mono-text" font-size="11" font-weight="500" fill="#475569">NODE // B.E. CSE (AI/ML)</text>

    <!-- Protocol Pill -->
    <rect x="394" y="28" width="146" height="30" rx="15" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <circle cx="410" cy="43" r="3" fill="#0284C7"/>
    <text x="421" y="47" class="mono-text" font-size="11" font-weight="500" fill="#475569">KARTHI.OS v2.6</text>

    <!-- Coordinate Stamp (Right) -->
    <text x="918" y="47" text-anchor="end" class="mono-text" font-size="11" font-weight="500" fill="#94A3B8">GEO // 13.0827° N, 80.2707° E</text>
  </g>

  <!-- Horizontal Divider Line -->
  <line x1="36" y1="74" x2="924" y2="74" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- LEFT HERO CONTENT -->
  <g id="hero-left">
    <!-- Small Category Label -->
    <g transform="translate(36, 102)">
      <rect x="0" y="0" width="134" height="22" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
      <text x="8" y="15" class="mono-text" font-size="10" font-weight="700" fill="#0284C7" letter-spacing="0.5">◈ AI ARCHITECT &amp; DEV</text>
    </g>

    <!-- Primary Display Name -->
    <text x="36" y="162" class="sans-text" font-size="40" font-weight="900" fill="url(#titleGrad)" letter-spacing="-1">
      KARTHIKEYAN M
    </text>

    <!-- Subtitle / Roles -->
    <text x="37" y="194" class="sans-text" font-size="15" font-weight="600" fill="#475569" letter-spacing="-0.2">
      AI/ML Engineer  •  Full-Stack Builder  •  Creative Technologist
    </text>

    <!-- Value Statement -->
    <text x="37" y="228" class="sans-text" font-size="13.5" font-weight="400" fill="#64748B">
      Turning ideas into intelligent systems, interactive products, and experiments that
    </text>
    <text x="37" y="248" class="sans-text" font-size="13.5" font-weight="400" fill="#64748B">
      probably should have been prototypes.
    </text>

    <!-- Interactive Concept Badges -->
    <g id="tags-group" transform="translate(36, 276)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="102" height="26" rx="13" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="12" cy="13" r="3" fill="#0284C7"/>
      <text x="21" y="17" class="mono-text" font-size="10.5" font-weight="600" fill="#334155">AI AGENTS</text>

      <!-- Tag 2 -->
      <rect x="110" y="0" width="124" height="26" rx="13" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="122" cy="13" r="3" fill="#6366F1"/>
      <text x="131" y="17" class="mono-text" font-size="10.5" font-weight="600" fill="#334155">3D &amp; SHADERS</text>

      <!-- Tag 3 -->
      <rect x="242" y="0" width="134" height="26" rx="13" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="254" cy="13" r="3" fill="#10B981"/>
      <text x="263" y="17" class="mono-text" font-size="10.5" font-weight="600" fill="#334155">SPACE INTELLIGENCE</text>

      <!-- Tag 4 -->
      <rect x="384" y="0" width="106" height="26" rx="13" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="396" cy="13" r="3" fill="#F59E0B"/>
      <text x="405" y="17" class="mono-text" font-size="10.5" font-weight="600" fill="#334155">FULL-STACK</text>

      <!-- Tag 5 -->
      <rect x="498" y="0" width="128" height="26" rx="13" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="510" cy="13" r="3" fill="#EC4899"/>
      <text x="519" y="17" class="mono-text" font-size="10.5" font-weight="600" fill="#334155">CREATIVE LABS</text>
    </g>
  </g>

  <!-- RIGHT HERO: K-01 ROBOT & COMPANION DOCK -->
  <g id="hero-right" class="floating-bot" transform="translate(680, 85)">
    <!-- Backing Radar Glow Disc -->
    <circle cx="120" cy="110" r="85" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="120" cy="110" r="60" fill="none" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="120" cy="110" r="35" fill="none" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Orbital Particles -->
    <circle cx="52" cy="72" r="2.5" fill="#0284C7" opacity="0.8"/>
    <circle cx="188" cy="150" r="2" fill="#6366F1" opacity="0.8"/>
    <circle cx="170" cy="60" r="2" fill="#10B981" opacity="0.8"/>

    <!-- K-01 BOT BODY -->
    <!-- Shadow beneath bot -->
    <ellipse cx="120" cy="200" rx="36" ry="6" fill="#0F172A" opacity="0.12"/>

    <!-- Thruster Hover Glow -->
    <ellipse cx="120" cy="180" rx="14" ry="4" fill="#38BDF8" opacity="0.6" filter="url(#glowCyan)"/>

    <!-- Bot Chassis (Torso) -->
    <rect x="94" y="125" width="52" height="46" rx="14" fill="url(#botChassis)" stroke="#CBD5E1" stroke-width="1.8"/>

    <!-- Torso Core Badge -->
    <circle cx="120" cy="148" r="7" fill="#0F172A"/>
    <circle cx="120" cy="148" r="4" fill="#0284C7" filter="url(#glowCyan)"/>

    <!-- Bot Head -->
    <rect x="88" y="70" width="64" height="50" rx="18" fill="url(#botChassis)" stroke="#CBD5E1" stroke-width="1.8"/>

    <!-- Visor (Screen) -->
    <rect x="96" y="80" width="48" height="30" rx="10" fill="url(#botVisor)"/>

    <!-- Visor Digital Eyes (Animated Blinking) -->
    <g class="bot-eye">
      <!-- Left Eye -->
      <rect x="104" y="90" width="10" height="9" rx="3" fill="#38BDF8" filter="url(#glowCyan)"/>
      <rect x="107" y="92" width="4" height="4" rx="1" fill="#FFFFFF"/>
      <!-- Right Eye -->
      <rect x="126" y="90" width="10" height="9" rx="3" fill="#38BDF8" filter="url(#glowCyan)"/>
      <rect x="129" y="92" width="4" height="4" rx="1" fill="#FFFFFF"/>
    </g>

    <!-- Antenna -->
    <g class="bot-antenna">
      <line x1="120" y1="70" x2="120" y2="52" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="120" cy="50" r="4.5" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.2"/>
      <!-- Antenna Wave Rings -->
      <circle cx="120" cy="50" r="9" fill="none" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>
    </g>

    <!-- Cute Mini Ears / Audio Sensors -->
    <rect x="84" y="86" width="5" height="16" rx="2.5" fill="#94A3B8"/>
    <rect x="151" y="86" width="5" height="16" rx="2.5" fill="#94A3B8"/>

    <!-- Tiny Mechanical Arms holding Laptop -->
    <!-- Left Arm -->
    <path d="M 94 136 Q 84 148 98 158" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <!-- Right Arm -->
    <path d="M 146 136 Q 156 148 142 158" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>

    <!-- Tiny Laptop -->
    <rect x="104" y="152" width="32" height="18" rx="3" fill="#0F172A" stroke="#E2E8F0" stroke-width="1"/>
    <!-- Laptop Screen Glow -->
    <rect x="107" y="154" width="26" height="12" rx="2" fill="#0284C7" opacity="0.9"/>
    <!-- Laptop Code Lines -->
    <line x1="110" y1="158" x2="124" y2="158" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="110" y1="162" x2="120" y2="162" stroke="#A5F3FC" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Laptop Base -->
    <polygon points="101,170 139,170 143,174 97,174" fill="#64748B"/>

    <!-- Assistant Identification Tag -->
    <g transform="translate(68, 218)">
      <rect x="0" y="0" width="104" height="22" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
      <circle cx="11" cy="11" r="3" fill="#0284C7"/>
      <text x="20" y="15" class="mono-text" font-size="9.5" font-weight="700" fill="#0F172A" letter-spacing="0.4">K-01 // COMPANION</text>
    </g>
  </g>
</svg>

