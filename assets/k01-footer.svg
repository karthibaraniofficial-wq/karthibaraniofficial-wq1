<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 140" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="footBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Bot Chassis -->
    <linearGradient id="chassisF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <filter id="footShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>

    <style>
      @keyframes botWalk {
        0% { transform: translateX(0px) translateY(0px); }
        25% { transform: translateX(10px) translateY(-4px); }
        50% { transform: translateX(20px) translateY(0px); }
        75% { transform: translateX(30px) translateY(-4px); }
        100% { transform: translateX(40px) translateY(0px); }
      }
      @keyframes legWalkLeft {
        0%, 100% { transform: rotate(-12deg); }
        50% { transform: rotate(12deg); }
      }
      @keyframes legWalkRight {
        0%, 100% { transform: rotate(12deg); }
        50% { transform: rotate(-12deg); }
      }
      @keyframes antennaWiggle {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(15deg); }
      }
      @keyframes blinkF {
        0%, 90%, 100% { transform: scaleY(1); }
        95% { transform: scaleY(0.1); }
      }

      .walking-cycle {
        animation: botWalk 4s ease-in-out infinite alternate;
      }
      .leg-left {
        animation: legWalkLeft 0.8s ease-in-out infinite;
        transform-origin: 104px 92px;
      }
      .leg-right {
        animation: legWalkRight 0.8s ease-in-out infinite;
        transform-origin: 116px 92px;
      }
      .antenna-wiggle {
        animation: antennaWiggle 1.5s ease-in-out infinite;
        transform-origin: 110px 42px;
      }
      .eyes-blink {
        animation: blinkF 3.5s infinite;
        transform-origin: center;
      }

      .mono-ft {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }
      .sans-ft {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="8" y="8" width="944" height="124" rx="16" fill="url(#footBg)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#footShadow)"/>

  <!-- Left: Footstep Trail -->
  <g transform="translate(40, 78)">
    <circle cx="0" cy="0" r="2.5" fill="#CBD5E1"/>
    <circle cx="16" cy="0" r="2.5" fill="#CBD5E1"/>
    <circle cx="32" cy="0" r="2.5" fill="#CBD5E1"/>
    <circle cx="48" cy="0" r="2.5" fill="#94A3B8"/>
    <circle cx="64" cy="0" r="2.5" fill="#64748B"/>
  </g>

  <!-- WALKING K-01 CHARACTER (Moving toward the right) -->
  <g class="walking-cycle" transform="translate(30, 0)">
    <!-- Shadow under bot -->
    <ellipse cx="110" cy="112" rx="20" ry="3.5" fill="#0F172A" opacity="0.12"/>

    <!-- Left Leg -->
    <g class="leg-left">
      <rect x="100" y="90" width="7" height="18" rx="3" fill="#94A3B8"/>
      <rect x="98" y="104" width="11" height="5" rx="2" fill="#64748B"/>
    </g>

    <!-- Right Leg -->
    <g class="leg-right">
      <rect x="113" y="90" width="7" height="18" rx="3" fill="#94A3B8"/>
      <rect x="111" y="104" width="11" height="5" rx="2" fill="#64748B"/>
    </g>

    <!-- Torso Chassis -->
    <rect x="92" y="60" width="36" height="32" rx="10" fill="url(#chassisF)" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="110" cy="74" r="4" fill="#0284C7"/>

    <!-- Head -->
    <rect x="88" y="30" width="44" height="32" rx="10" fill="url(#chassisF)" stroke="#CBD5E1" stroke-width="1.5"/>
    <!-- Visor -->
    <rect x="94" y="36" width="32" height="20" rx="6" fill="#0F172A"/>

    <!-- Blinking Eyes -->
    <g class="eyes-blink">
      <rect x="100" y="42" width="7" height="7" rx="2" fill="#38BDF8"/>
      <rect x="113" y="42" width="7" height="7" rx="2" fill="#38BDF8"/>
    </g>

    <!-- Antenna -->
    <g class="antenna-wiggle">
      <line x1="110" y1="30" x2="110" y2="18" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
      <circle cx="110" cy="16" r="3.5" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1"/>
    </g>

    <!-- Waving / Walking Arm -->
    <path d="M 126 68 Q 138 64 134 52" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="134" cy="52" r="3" fill="#64748B"/>

    <!-- Speech Bubble Attached to Bot -->
    <g transform="translate(145, 28)">
      <!-- Bubble Shell -->
      <rect x="0" y="0" width="360" height="54" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
      <!-- Bubble Pointer -->
      <polygon points="0,22 -8,27 0,32" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
      <line x1="0" y1="23" x2="0" y2="31" stroke="#FFFFFF" stroke-width="2"/>

      <text x="14" y="22" class="mono-ft" font-size="9.5" font-weight="700" fill="#0284C7">
        K-01 SAYS:
      </text>
      <text x="14" y="40" class="sans-ft" font-size="12" font-weight="600" fill="#0F172A">
        "You're still scrolling. Interesting... You reached EOF of my system!"
      </text>
    </g>
  </g>

  <!-- Right Side Status Badges -->
  <g transform="translate(680, 48)">
    <rect x="0" y="0" width="240" height="44" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="18" cy="22" r="4" fill="#10B981"/>
    <text x="30" y="20" class="mono-ft" font-size="9.5" font-weight="700" fill="#0F172A">STATUS: TRANSMISSION COMPLETE</text>
    <text x="30" y="34" class="sans-ft" font-size="10" fill="#64748B">Ready for collaborations &amp; ideas</text>
  </g>
</svg>

