<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="dbgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Code Block Gradient -->
    <linearGradient id="codeBoxBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <filter id="dbgShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>

    <style>
      .mono-m {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }
      .sans-m {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="8" y="8" width="944" height="204" rx="16" fill="url(#dbgBg)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#dbgShadow)"/>

  <!-- Left: DEBUGGING MYSELF (Code Loop) -->
  <g transform="translate(28, 22)">
    <!-- Header -->
    <rect x="0" y="0" width="144" height="20" rx="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    <text x="72" y="14" text-anchor="middle" class="mono-m" font-size="9" font-weight="700" fill="#6366F1" letter-spacing="0.5">DEBUGGING MYSELF</text>
    <text x="156" y="15" class="sans-m" font-size="11.5" font-weight="700" fill="#0F172A">
      OPERATOR EXECUTION LOOP
    </text>

    <!-- Code Card Container -->
    <rect x="0" y="30" width="420" height="136" rx="10" fill="url(#codeBoxBg)" stroke="#E2E8F0" stroke-width="1.2"/>

    <!-- Mac-style micro dots -->
    <circle cx="16" cy="44" r="3.5" fill="#EF4444"/>
    <circle cx="28" cy="44" r="3.5" fill="#F59E0B"/>
    <circle cx="40" cy="44" r="3.5" fill="#10B981"/>
    <text x="60" y="47" class="mono-m" font-size="9" fill="#94A3B8">karthi_runtime.ts</text>

    <!-- Code lines -->
    <g transform="translate(16, 68)" class="mono-m" font-size="11">
      <text x="0" y="0">
        <tspan fill="#6366F1" font-weight="700">function</tspan> <tspan fill="#0284C7" font-weight="700">lifeCycle</tspan>() {
      </text>
      <text x="16" y="18">
        <tspan fill="#0F172A">sleep();</tspan>    <tspan fill="#94A3B8">// → sometimes ⏳</tspan>
      </text>
      <text x="16" y="34">
        <tspan fill="#0F172A">coffee();</tspan>   <tspan fill="#94A3B8">// → optional ☕</tspan>
      </text>
      <text x="16" y="50">
        <tspan fill="#0284C7" font-weight="700">build();</tspan>    <tspan fill="#10B981" font-weight="600">// → always ⚡</tspan>
      </text>
      <text x="16" y="66">
        <tspan fill="#0F172A">break();</tspan>    <tspan fill="#F59E0B" font-weight="600">// → frequently 💥</tspan>
      </text>
      <text x="16" y="82">
        <tspan fill="#0F172A">fix();</tspan>      <tspan fill="#0284C7" font-weight="600">// → eventually 🔧</tspan>
      </text>
      <text x="0" y="98">
        <tspan fill="#6366F1" font-weight="700">repeat</tspan>();    <tspan fill="#64748B">// → infinite loop 🔁</tspan>
      </text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="486" y1="24" x2="486" y2="196" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Right: THE CONTRIBUTION MATRIX -->
  <g transform="translate(516, 22)">
    <!-- Header -->
    <rect x="0" y="0" width="168" height="20" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <text x="84" y="14" text-anchor="middle" class="mono-m" font-size="9" font-weight="700" fill="#059669" letter-spacing="0.5">THE CONTRIBUTION MATRIX</text>
    <text x="180" y="15" class="sans-m" font-size="11.5" font-weight="700" fill="#0F172A">
      EVIDENCE OF CODE COMMITS
    </text>

    <!-- Description -->
    <text x="0" y="48" class="sans-m" font-size="12" fill="#475569" font-style="italic">
      "Empirical digital evidence that I occasionally leave my room,
    </text>
    <text x="0" y="66" class="sans-m" font-size="12" fill="#475569" font-style="italic">
      hydrate, and commit code to the digital universe."
    </text>

