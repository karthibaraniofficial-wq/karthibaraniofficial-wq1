      <rect x="378" y="0" width="14" height="14" rx="3" fill="#10B981"/>

      <!-- Row 2 -->
      <rect x="0" y="18" width="14" height="14" rx="3" fill="#10B981"/>
      <rect x="18" y="18" width="14" height="14" rx="3" fill="#047857"/>
      <rect x="36" y="18" width="14" height="14" rx="3" fill="#34D399"/>
