      <rect x="288" y="18" width="14" height="14" rx="3" fill="#10B981"/>
      <rect x="306" y="18" width="14" height="14" rx="3" fill="#34D399"/>
      <rect x="324" y="18" width="14" height="14" rx="3" fill="#10B981"/>
      <rect x="342" y="18" width="14" height="14" rx="3" fill="#047857"/>
      <rect x="360" y="18" width="14" height="14" rx="3" fill="#10B981"/>
      <rect x="378" y="18" width="14" height="14" rx="3" fill="#34D399"/>
    </g>

    <!-- Metric Status Pills -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="124" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="10" cy="12" r="3" fill="#10B981"/>
      <text x="18" y="16" class="mono-m" font-size="9" font-weight="600" fill="#334155">BUILD CONSISTENCY</text>

      <rect x="132" y="0" width="128" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="142" cy="12" r="3" fill="#0284C7"/>
      <text x="150" y="16" class="mono-m" font-size="9" font-weight="600" fill="#334155">ZERO SHELFWARE</text>

      <rect x="268" y="0" width="134" height="24" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <circle cx="278" cy="12" r="3" fill="#6366F1"/>
      <text x="286" y="16" class="mono-m" font-size="9" font-weight="600" fill="#334155">PROTOTYPE TO PROD</text>
    </g>
