<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="buildBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="radarSweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </linearGradient>

    <filter id="buildShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>

    <style>
      @keyframes radarRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pingBlip {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(1.4); }
      }
      .radar-arm {
        animation: radarRotate 4s linear infinite;
        transform-origin: 95px 105px;
      }
      .radar-blip {
        animation: pingBlip 2s ease-in-out infinite;
        transform-origin: center;
      }
      .mono-b {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }
      .sans-b {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Container Shell -->
  <rect x="8" y="8" width="944" height="194" rx="16" fill="url(#buildBg)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#buildShadow)"/>

  <!-- LEFT: Radar Operations Screen -->
  <g transform="translate(10, 0)">
    <!-- Radar Outer Bezel -->
    <circle cx="95" cy="105" r="68" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="95" cy="105" r="48" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="95" cy="105" r="28" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    <line x1="95" y1="37" x2="95" y2="173" stroke="#E2E8F0" stroke-width="0.8"/>
    <line x1="27" y1="105" x2="163" y2="105" stroke="#E2E8F0" stroke-width="0.8"/>

    <!-- Radar Rotating Beam -->
    <g class="radar-arm">
      <path d="M 95 105 L 143 65 A 68 68 0 0 1 163 105 Z" fill="url(#radarSweepGrad)"/>
      <line x1="95" y1="105" x2="163" y2="105" stroke="#0284C7" stroke-width="1.5"/>
    </g>

    <!-- Radar Target Blips -->
    <circle cx="120" cy="80" r="3" fill="#10B981" class="radar-blip"/>
    <circle cx="70" cy="125" r="2.5" fill="#0284C7" class="radar-blip"/>
    <circle cx="130" cy="130" r="2.5" fill="#F59E0B" class="radar-blip"/>

    <text x="95" y="186" text-anchor="middle" class="mono-b" font-size="8.5" font-weight="700" fill="#64748B">R&amp;D RADAR BEACON</text>
  </g>

  <!-- Divider -->
  <line x1="195" y1="24" x2="195" y2="186" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- RIGHT: Active Development Threads -->
  <g transform="translate(215, 20)">
    <!-- Header -->
    <rect x="0" y="0" width="160" height="20" rx="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    <text x="80" y="14" text-anchor="middle" class="mono-b" font-size="9" font-weight="700" fill="#0284C7" letter-spacing="0.5">CURRENTLY BUILDING</text>
    <text x="172" y="15" class="sans-b" font-size="12" font-weight="700" fill="#0F172A">
      ACTIVE PIPELINES &amp; WORKSPACE THREADS
    </text>

    <!-- 4 Active Lines -->
    <!-- Thread 1 -->
    <g transform="translate(0, 32)">
      <rect x="0" y="0" width="705" height="28" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="8" y="5" width="62" height="18" rx="4" fill="#E0F2FE"/>
      <text x="39" y="17" text-anchor="middle" class="mono-b" font-size="8.5" font-weight="700" fill="#0284C7">THREAD 01</text>
      <text x="80" y="18" class="sans-b" font-size="11.5" font-weight="600" fill="#0F172A">
        ▸ ASTRA-SENTINEL: <tspan font-weight="400" fill="#64748B">AI Space Situational Awareness, multi-agent debris conjunction &amp; timeline replay</tspan>
      </text>
      <circle cx="688" cy="14" r="3.5" fill="#10B981"/>
    </g>

    <!-- Thread 2 -->
    <g transform="translate(0, 66)">
      <rect x="0" y="0" width="705" height="28" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="8" y="5" width="62" height="18" rx="4" fill="#EEF2FF"/>
      <text x="39" y="17" text-anchor="middle" class="mono-b" font-size="8.5" font-weight="700" fill="#6366F1">SIH 2026</text>
      <text x="80" y="18" class="sans-b" font-size="11.5" font-weight="600" fill="#0F172A">
        ▸ SatQuery AI: <tspan font-weight="400" fill="#64748B">Multimodal radar (SAR) &amp; optical earth observation vision-language assistant (Team Targaryen)</tspan>
      </text>
      <circle cx="688" cy="14" r="3.5" fill="#6366F1"/>
    </g>

    <!-- Thread 3 -->
    <g transform="translate(0, 100)">
      <rect x="0" y="0" width="705" height="28" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="8" y="5" width="62" height="18" rx="4" fill="#FEF3C7"/>
      <text x="39" y="17" text-anchor="middle" class="mono-b" font-size="8.5" font-weight="700" fill="#D97706">GRAPHICS</text>
      <text x="80" y="18" class="sans-b" font-size="11.5" font-weight="600" fill="#0F172A">
        ▸ Procedural 3D Worlds &amp; Shaders: <tspan font-weight="400" fill="#64748B">Rayleigh atmosphere scattering, Godot 4 WebAssembly, and interactive WebGL canvas</tspan>
      </text>
      <circle cx="688" cy="14" r="3.5" fill="#F59E0B"/>
    </g>

    <!-- Thread 4 -->
    <g transform="translate(0, 134)">
      <rect x="0" y="0" width="705" height="28" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="8" y="5" width="62" height="18" rx="4" fill="#F1F5F9"/>
      <text x="39" y="17" text-anchor="middle" class="mono-b" font-size="8.5" font-weight="700" fill="#475569">LABS</text>
      <text x="80" y="18" class="sans-b" font-size="11.5" font-weight="600" fill="#0F172A">
        ▸ Ridiculous Side Projects: <tspan font-weight="400" fill="#64748B">Experimental prototypes, autonomous agents, and human-AI interface playgrounds</tspan>
      </text>
      <circle cx="688" cy="14" r="3.5" fill="#0284C7"/>
    </g>
  </g>
</svg>

